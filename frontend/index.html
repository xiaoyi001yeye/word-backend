<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#66584a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5efe7;">
        <section style="width:min(420px,100%);border:1px solid rgba(140,92,46,.18);border-radius:8px;background:rgba(255,255,255,.82);padding:28px;text-align:center;box-shadow:0 18px 48px rgba(44,34,22,.1);">
          <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8b6f57;">Word Atelier</p>
          <h1 style="margin:0;font-size:28px;color:#241c14;">登录页加载中</h1>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var rootId = 'root';
        var renderedAttribute = 'data-startup-rendered';
        function messageOf(error) {
          if (!error) return '未知前端启动错误';
          if (error.message) return error.message;
          if (error.reason) return messageOf(error.reason);
          return String(error);
        }
        function showStartupFailure(title, detail) {
          var root = document.getElementById(rootId);
          if (!root || root.getAttribute(renderedAttribute) === 'true') return;
          root.innerHTML = '<main class="startup-error" role="alert"><section>'
            + '<p>Application Error</p><h1>' + title + '</h1>'
            + '<pre>' + String(detail || '未知前端启动错误').replace(/[<>&]/g, function (char) {
              return char === '<' ? '&lt;' : char === '>' ? '&gt;' : '&amp;';
            }) + '</pre>'
            + '<button type="button" onclick="window.location.reload()">重新加载</button>'
            + '</section></main>';
        }
        function showStartupStatus(title, detail) {
          var root = document.getElementById(rootId);
          if (!root || root.getAttribute(renderedAttribute) === 'true') return;
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#66584a;font-family:system-ui,-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;background:#f5efe7;">'
            + '<section style="width:min(420px,100%);border:1px solid rgba(140,92,46,.18);border-radius:8px;background:rgba(255,255,255,.82);padding:28px;text-align:center;box-shadow:0 18px 48px rgba(44,34,22,.1);">'
            + '<p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8b6f57;">Word Atelier</p>'
            + '<h1 style="margin:0 0 10px;font-size:28px;color:#241c14;">' + title + '</h1>'
            + '<p style="margin:0;color:#66584a;">' + detail + '</p>'
            + '</section></main>';
        }
        window.__wordAtelierEntryLoaded = function () {
          showStartupStatus('入口脚本已加载', '正在初始化登录页...');
          window.setTimeout(function () {
            var root = document.getElementById(rootId);
            if (!root || root.getAttribute(renderedAttribute) === 'true') return;
            showStartupFailure('页面初始化未完成', '入口脚本已加载，但应用没有完成渲染。请检查浏览器 Console 或 Network。');
          }, 8000);
        };
        window.__wordAtelierEntryFailed = function () {
          showStartupFailure('入口脚本加载失败', '浏览器没有成功加载前端入口脚本，请检查 Network 中 JS 请求状态。');
        };
        window.addEventListener('error', function (event) {
          showStartupFailure('页面启动失败', messageOf(event.error || event.message));
        });
        window.addEventListener('unhandledrejection', function (event) {
          showStartupFailure('页面启动失败', messageOf(event.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
